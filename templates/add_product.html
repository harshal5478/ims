{% extends 'base.html' %}

{% block title %}Add Product{% endblock %}
{% block body_class %}app-body add-product-body{% endblock %}

{% block styles %}
<style>
  .add-product-body {
    background: linear-gradient(135deg, #1d2671, #c33764);
  }
  .add-product-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 70px);
  }
  .add-product-card {
    background: #fff;
    width: 100%;
    max-width: 520px;
    border-radius: 18px;
    padding: 36px 40px;
    box-shadow: 0 25px 45px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
  }
  .add-product-card::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 160px;
    height: 160px;
    background: rgba(195, 55, 100, 0.15);
    border-radius: 50%;
  }
  .add-product-card h1 {
    margin-top: 0;
    text-align: center;
    color: #1d2671;
    letter-spacing: 1px;
  }
  .add-product-card .mb-3 {
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
  }
  .add-product-card label {
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }
  .add-product-card input,
  .add-product-card textarea {
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .add-product-card input:focus,
  .add-product-card textarea:focus {
    border-color: #c33764;
    box-shadow: 0 0 0 3px rgba(195, 55, 100, 0.15);
    outline: none;
  }
  .add-product-card textarea {
    min-height: 100px;
    resize: vertical;
  }
  .add-product-card .btn-submit {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(120deg, #c33764, #1d2671);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .add-product-card .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(29, 38, 113, 0.25);
  }
  .add-product-card .note {
    margin-top: 12px;
    font-size: 13px;
    color: #777;
    text-align: center;
  }
</style>
{% endblock %}

{% block content %}
<div class="add-product-wrapper">
  <div class="add-product-card">
    <h1>Add New Product</h1>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" required>
      </div>
      <div class="mb-3">
        <label>Category</label>
        <input type="text" name="category">
      </div>
      <div class="mb-3">
        <label>Description</label>
        <textarea name="description"></textarea>
      </div>
      <div class="mb-3">
        <label>Price</label>
        <input type="number" step="0.01" name="price" required>
      </div>
      <div class="mb-3">
        <label>Quantity</label>
        <input type="number" name="quantity" min="0" required>
      </div>
      <div class="mb-3">
        <label>Product Image</label>
        <input type="file" name="image" accept="image/*">
      </div>
      <button type="submit" class="btn-submit">Add Product</button>
      <p class="note mb-0">Ensure all details are accurate before submitting.</p>
    </form>
  </div>
</div>
{% endblock %}
